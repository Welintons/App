<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ordens de Serviço — WS SOLUÇÕES</title>

    <!-- CSS EXCLUSIVO DA PÁGINA -->
    <link
        rel="stylesheet"
        href="css/os.css">

</head>


<body>


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="topbar">

        <div class="topbar-left">

            <button
                type="button"
                class="btn-voltar"
                id="btnVoltar">

                ←

            </button>


            <div class="brand">

                <strong>
                    WS SOLUÇÕES
                </strong>

                <span>
                    Ordens de Serviço
                </span>

            </div>

        </div>


        <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Alternar tema">

            ☾

        </button>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="page-container">


        <!-- =================================================
             CABEÇALHO
        ================================================== -->

        <section class="page-header">

            <div>

                <span class="page-kicker">
                    Gestão
                </span>

                <h1>
                    Ordens de Serviço
                </h1>

                <p>
                    Controle os serviços da WS SOLUÇÕES.
                </p>

            </div>


            <button
                type="button"
                class="btn-primary"
                id="btnNovaOS">

                + Nova OS

            </button>

        </section>



        <!-- =================================================
             ESTATÍSTICA
        ================================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <span class="stat-label">
                    Total de OS
                </span>

                <strong
                    class="stat-value"
                    id="totalOS">

                    0

                </strong>

            </div>

        </section>



        <!-- =================================================
             BUSCA
        ================================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    type="search"
                    id="buscaOS"
                    placeholder="Buscar por código, cliente, aparelho ou status..."
                    autocomplete="off">

            </div>

        </section>



        <!-- =================================================
             LISTA DE OS
        ================================================== -->

        <section class="list-section">

            <div class="section-title">

                <div>

                    <span>
                        Ordens cadastradas
                    </span>

                </div>

            </div>


            <div
                id="listaOS"
                class="os-list">

                <div class="os-loading">

                    Carregando ordens de serviço...

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         MODAL — NOVA / EDITAR OS
    ====================================================== -->

    <div
        class="modal"
        id="modalOS"
        aria-hidden="true">

        <div class="modal-overlay">


            <div
                class="modal-content modal-os"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modalTitulo">


                <!-- =========================================
                     CABEÇALHO DO MODAL
                ========================================== -->

                <div class="modal-header">

                    <div>

                        <span class="modal-kicker">
                            Ordem de serviço
                        </span>

                        <h2 id="modalTitulo">
                            Nova OS
                        </h2>

                    </div>


                    <button
                        type="button"
                        class="btn-fechar"
                        id="btnFecharModal"
                        aria-label="Fechar">

                        ×

                    </button>

                </div>



                <!-- =========================================
                     FORMULÁRIO
                ========================================== -->

                <form
                    id="formOS"
                    autocomplete="off">


                    <!-- =====================================
                         IDENTIFICAÇÃO
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Identificação
                        </div>


                        <input
                            type="hidden"
                            id="osId">


                        <div class="form-grid">

                            <div class="form-group">

                                <label for="codigo">
                                    Código
                                </label>

                                <input
                                    type="text"
                                    id="codigo"
                                    readonly
                                    placeholder="WS-OS-000001">

                            </div>


                            <div class="form-group">

                                <label for="status">
                                    Status
                                </label>

                                <select id="status">

                                    <option value="aberta">
                                        Aberta
                                    </option>

                                    <option value="em_andamento">
                                        Em andamento
                                    </option>

                                    <option value="aguardando_aprovacao">
                                        Aguardando aprovação
                                    </option>

                                    <option value="aguardando_peca">
                                        Aguardando peça
                                    </option>

                                    <option value="concluida">
                                        Concluída
                                    </option>

                                    <option value="cancelada">
                                        Cancelada
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label for="prioridade">
                                    Prioridade
                                </label>

                                <select id="prioridade">

                                    <option value="normal">
                                        Normal
                                    </option>

                                    <option value="baixa">
                                        Baixa
                                    </option>

                                    <option value="alta">
                                        Alta
                                    </option>

                                    <option value="urgente">
                                        Urgente
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         CLIENTE
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Cliente
                        </div>


                        <div class="form-grid">

                            <div
                                class="form-group form-group-full">

                                <label for="cliente_id">
                                    Cliente
                                </label>

                                <select id="cliente_id">

                                    <option value="">
                                        Selecione o cliente
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         EQUIPAMENTO
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Equipamento
                        </div>


                        <div class="form-grid">

                            <div class="form-group">

                                <label for="equipamento_id">
                                    Equipamento
                                </label>

                                <select id="equipamento_id">

                                    <option value="">
                                        Selecione o equipamento
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label for="tipo_servico">
                                    Tipo de serviço
                                </label>

                                <input
                                    type="text"
                                    id="tipo_servico"
                                    placeholder="Ex.: Manutenção">

                            </div>


                            <div class="form-group">

                                <label for="aparelho">
                                    Aparelho
                                </label>

                                <input
                                    type="text"
                                    id="aparelho"
                                    placeholder="Ex.: TV, Micro-ondas, Máquina...">

                            </div>


                            <div class="form-group">

                                <label for="marca">
                                    Marca
                                </label>

                                <input
                                    type="text"
                                    id="marca"
                                    placeholder="Ex.: LG">

                            </div>


                            <div class="form-group">

                                <label for="modelo">
                                    Modelo
                                </label>

                                <input
                                    type="text"
                                    id="modelo"
                                    placeholder="Modelo do aparelho">

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         DEFEITO
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Diagnóstico
                        </div>


                        <div class="form-grid">

                            <div
                                class="form-group form-group-full">

                                <label for="defeito">
                                    Defeito informado
                                </label>

                                <textarea
                                    id="defeito"
                                    rows="3"
                                    placeholder="Descreva o problema informado pelo cliente..."></textarea>

                            </div>


                            <div
                                class="form-group form-group-full">

                                <label for="diagnostico">
                                    Diagnóstico
                                </label>

                                <textarea
                                    id="diagnostico"
                                    rows="3"
                                    placeholder="Descreva o diagnóstico técnico..."></textarea>

                            </div>


                            <div
                                class="form-group form-group-full">

                                <label for="servico_realizado">
                                    Serviço realizado
                                </label>

                                <textarea
                                    id="servico_realizado"
                                    rows="3"
                                    placeholder="Descreva o serviço realizado..."></textarea>

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         VALORES
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Valores
                        </div>


                        <div class="form-grid">

                            <div class="form-group">

                                <label for="valor">
                                    Valor
                                </label>

                                <input
                                    type="number"
                                    id="valor"
                                    min="0"
                                    step="0.01"
                                    placeholder="0,00">

                            </div>


                            <div class="form-group">

                                <label for="desconto">
                                    Desconto
                                </label>

                                <input
                                    type="number"
                                    id="desconto"
                                    min="0"
                                    step="0.01"
                                    value="0"
                                    placeholder="0,00">

                            </div>


                            <div class="form-group">

                                <label for="valor_total">
                                    Valor total
                                </label>

                                <input
                                    type="number"
                                    id="valor_total"
                                    step="0.01"
                                    readonly
                                    placeholder="0,00">

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         DATAS
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Datas
                        </div>


                        <div class="form-grid">

                            <div class="form-group">

                                <label for="data_entrada">
                                    Data de entrada
                                </label>

                                <input
                                    type="date"
                                    id="data_entrada">

                            </div>


                            <div class="form-group">

                                <label for="data_conclusao">
                                    Data de conclusão
                                </label>

                                <input
                                    type="date"
                                    id="data_conclusao">

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         OBSERVAÇÕES
                    ====================================== -->

                    <div class="form-section">

                        <div class="form-section-title">
                            Observações
                        </div>


                        <div class="form-grid">

                            <div
                                class="form-group form-group-full">

                                <textarea
                                    id="observacoes"
                                    rows="4"
                                    placeholder="Observações internas da OS..."></textarea>

                            </div>

                        </div>

                    </div>



                    <!-- =====================================
                         AÇÕES
                    ====================================== -->

                    <div class="modal-actions">

                        <button
                            type="button"
                            class="btn-secondary"
                            id="btnCancelar">

                            Cancelar

                        </button>


                        <button
                            type="submit"
                            class="btn-primary"
                            id="btnSalvarOS">

                            Salvar OS

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>



    <!-- =====================================================
         MODAL — DETALHES DA OS
    ====================================================== -->

    <div
        class="modal"
        id="modalDetalhesOS"
        aria-hidden="true">

        <div class="modal-overlay">


            <div
                class="modal-content modal-detalhes"
                role="dialog"
                aria-modal="true"
                aria-labelledby="detalhesTitulo">


                <!-- =========================================
                     CABEÇALHO
                ========================================== -->

                <div class="modal-header">

                    <div>

                        <span class="modal-kicker">
