<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f3ff;
        color: #1f2937;
    }

    header {
        background: linear-gradient(
            135deg,
            #7c3aed,
            #4c1d95
        );
        color: white;
        padding: 25px 20px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    header h1 {
        font-size: 28px;
        margin-bottom: 6px;
    }

    header p {
        opacity: .9;
        font-size: 14px;
    }

    main {
        width: 100%;
        max-width: 700px;
        margin: 30px auto;
        padding: 0 15px 40px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card h2 {
        color: #4c1d95;
        margin-bottom: 18px;
        font-size: 21px;
    }

    /* CALENDÁRIO */

    .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .calendar-header h3 {
        font-size: 19px;
        color: #111827;
    }

    .calendar-header button {
        border: none;
        background: #7c3aed;
        color: white;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
    }

    .calendar-header button:hover {
        background: #6d28d9;
    }

    .weekdays,
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
    }

    .weekday {
        text-align: center;
        font-size: 12px;
        font-weight: bold;
        color: #6b7280;
        padding: 8px 0;
    }

    .day {
        min-height: 48px;
        border-radius: 10px;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-size: 14px;
    }

    .day.empty {
        background: transparent;
    }

    .day.today {
        outline: 2px solid #7c3aed;
        outline-offset: -2px;
    }

    .day.occupied {
        background: #fee2e2;
        color: #991b1b;
        font-weight: bold;
    }

    .day.occupied::after {
        content: "";
        position: absolute;
        bottom: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #dc2626;
    }

    .legend {
        display: flex;
        gap: 18px;
        margin-top: 18px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #4b5563;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .legend-box {
        width: 13px;
        height: 13px;
        border-radius: 4px;
    }

    .legend-occupied {
        background: #fee2e2;
        border: 1px solid #dc2626;
    }

    .legend-free {
        background: #f9fafb;
        border: 1px solid #d1d5db;
    }

    /* CONSULTA OS */

    .search-box {
        display: flex;
        gap: 10px;
    }

    .search-box input {
        flex: 1;
        min-width: 0;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 13px;
        font-size: 15px;
        outline: none;
    }

    .search-box input:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 3px rgba(124,58,237,.12);
    }

    .search-box button {
        border: none;
        background: #7c3aed;
        color: white;
        padding: 0 20px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    .search-box button:hover {
        background: #6d28d9;
    }

    .message {
        margin-top: 15px;
        padding: 13px;
        border-radius: 10px;
        display: none;
        font-size: 14px;
    }

    .message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
    }

    .message.info {
        display: block;
        background: #ede9fe;
        color: #5b21b6;
    }

    .os-result {
        display: none;
        margin-top: 18px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        overflow: hidden;
    }

    .os-result-header {
        background: #7c3aed;
        color: white;
        padding: 15px;
    }

    .os-result-header strong {
        font-size: 18px;
    }

    .os-info {
        padding: 15px;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 11px 0;
        border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
        border-bottom: none;
    }

    .info-label {
        color: #6b7280;
        font-size: 13px;
    }

    .info-value {
        text-align: right;
        font-weight: bold;
        font-size: 14px;
    }

    .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 8px;
        background: #ede9fe;
        color: #5b21b6;
        font-size: 12px;
    }

    footer {
        text-align: center;
        color: #6b7280;
        font-size: 12px;
        padding: 10px 20px 30px;
    }

    @media (max-width: 500px) {

        main {
            margin-top: 20px;
        }

        .card {
            padding: 15px;
        }

        .search-box {
            flex-direction: column;
        }

        .search-box button {
            height: 46px;
        }

        .day {
            min-height: 42px;
        }

        .weekday {
            font-size: 11px;
        }

        .info-row {
            flex-direction: column;
            gap: 5px;
        }

        .info-value {
            text-align: left;
        }

    }

</style>

    <div

    <h2>Consultar Ordem de Serviço</h2>

            type="text"
            id="codigoOS"
            placeholder="Ex.: WS-OS-000001"
            autocomplete="off">

        <button id="btnConsultar">

        </button>

            </strong>

        <div class="os-info">

            <div class="info-row">

                <span class="info-label">

                </span>

                <span
                    class="info-value"
                    id="resultadoAparelho">
                    -
                </span>

            <div class="info-row">

                <span class="info-label">
                    Marca
                </span>

                <span
                    class="info-value"
                    id="resultadoMarca">
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Modelo
                </span>

                <span
                    class="info-value"
                    id="resultadoModelo">
                    -
                </span>

            </div>


            <div class="info-row">

                <span
                    class="info-value"
                    id="resultadoServico">

</main><footer>WS SOLUÇÕES © 2026

</footer><script>

document.addEventListener("DOMContentLoaded", () => {

    /*
    ========================================================
    VERIFICAÇÃO DO SUPABASE
    ========================================================
    */

    if (typeof supabaseClient === "undefined") {

        console.error(
            "supabaseClient não foi encontrado."
        );

        mostrarMensagem(
            "Erro na conexão com o sistema. Verifique o arquivo js/supabase.js.",
            "error"
        );

        return;

    }


    /*
    ========================================================
    ELEMENTOS
    ========================================================
    */

    const calendarGrid =
        document.getElementById("calendarGrid");

    const mesAno =
        document.getElementById("mesAno");

    const btnAnterior =
        document.getElementById("btnAnterior");

    const btnProximo =
        document.getElementById("btnProximo");

    const codigoOS =
        document.getElementById("codigoOS");

    const btnConsultar =
        document.getElementById("btnConsultar");

    const resultadoOS =
        document.getElementById("resultadoOS");

    const mensagem =
        document.getElementById("mensagem");


    /*
    ========================================================
    DATA ATUAL DO CALENDÁRIO
    ========================================================
    */

    let dataCalendario = new Date();


    /*
    ========================================================
    NOMES DOS MESES
    ========================================================
    */

    const meses = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro"
    ];


    /*
    ========================================================
    STATUS
    ========================================================
    */

    const statusMap = {

        aberta: "Aberta",

        aguardando: "Aguardando",

        em_andamento: "Em andamento",

        aguardando_peca: "Aguardando peça",

        concluida: "Concluída",

        entregue: "Entregue",

        cancelada: "Cancelada"

    };


    /*
    ========================================================
    ESCAPAR HTML
    ========================================================
    */

    function escaparHTML(valor) {

        if (valor === null || valor === undefined) {
            return "-";
        }

        return String(valor)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
    ========================================================
    MENSAGEM
    ========================================================
    */

    function mostrarMensagem(texto, tipo = "info") {

        mensagem.textContent = texto;

        mensagem.className =
            "message " + tipo;

    }


    function limparMensagem() {

        mensagem.textContent = "";

        mensagem.className =
            "message";

    }


    /*
    ========================================================
    CARREGAR CALENDÁRIO
    ========================================================
    */

    async function carregarCalendario() {

        calendarGrid.innerHTML = "";

        const ano =
            dataCalendario.getFullYear();

        const mes =
            dataCalendario.getMonth();


        mesAno.textContent =
            `${meses[mes]} de ${ano}`;


        /*
        Primeiro e último dia do mês
        */

        const primeiroDia =
            new Date(ano, mes, 1);

        const ultimoDia =
            new Date(ano, mes + 1, 0);


        /*
        Dia da semana do primeiro dia
        */

        const inicioSemana =
            primeiroDia.getDay();


        /*
        Quantidade de dias
        */

        const quantidadeDias =
            ultimoDia.getDate();


        /*
        Formato para consulta Supabase
        */

        const inicio =
            `${ano}-${String(mes + 1).padStart(2, "0")}-01`;

        const fim =
            `${ano}-${String(mes + 1).padStart(2, "0")}-${String(quantidadeDias).padStart(2, "0")}`;


        /*
        Busca somente as datas.

        NÃO busca nome,
        telefone,
        aparelho,
        defeito etc.
        */

        const { data, error } =
            await supabaseClient
                .from("agendamentos")
                .select("data")
                .gte("data", inicio)
                .lte("data", fim);


        if (error) {

            console.error(
                "Erro ao carregar agenda:",
                error
            );

            calendarGrid.innerHTML = "";

            mostrarMensagem(
                "Não foi possível carregar a agenda.",
                "error"
            );

            return;

        }


        /*
        Cria conjunto de dias ocupados
        */

        const diasOcupados =
            new Set();


        if (data) {

            data.forEach(item => {

                if (item.data) {

                    /*
                    Evita problemas com horário/timezone
                    */

                    const dia =
                        String(item.data).substring(0, 10);

                    diasOcupados.add(dia);

                }

            });

        }


        /*
        Espaços antes do primeiro dia
        */

        for (
            let i = 0;
            i < inicioSemana;
            i++
        ) {

            const vazio =
                document.createElement("div");

            vazio.className =
                "day empty";

            calendarGrid.appendChild(vazio);

        }


        /*
        Cria os dias
        */

        const hoje = new Date();

        for (
            let dia = 1;
            dia <= quantidadeDias;
            dia++
        ) {

            const elemento =
                document.createElement("div");

            elemento.className =
                "day";


            const dataFormatada =
                `${ano}-${String(mes + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;


            /*
            Dia ocupado
            */

            if (
                diasOcupados.has(dataFormatada)
            ) {

                elemento.classList.add(
                    "occupied"
                );

            }


            /*
            Dia atual
            */

            if (
                dia === hoje.getDate() &&
                mes === hoje.getMonth() &&
                ano === hoje.getFullYear()
            ) {

                elemento.classList.add(
                    "today"
                );

            }


            elemento.textContent =
                dia;


            calendarGrid.appendChild(
                elemento
            );

        }

    }


    /*
    ========================================================
    CONSULTAR ORDEM DE SERVIÇO
    ========================================================
    */

    async function consultarOS() {

        limparMensagem();

        resultadoOS.style.display =
            "none";


        let codigo =
            codigoOS.value.trim();


        if (!codigo) {

            mostrarMensagem(
                "Digite o código da Ordem de Serviço.",
                "error"
            );

            codigoOS.focus();

            return;

        }


        /*
        Aceita letras minúsculas digitadas
        */

        codigo =
            codigo.toUpperCase();


        btnConsultar.disabled =
            true;

        btnConsultar.textContent =
            "Consultando...";


        try {

            /*
            IMPORTANTE:

            Busca SOMENTE dados públicos
            da OS.

            Não busca:
            nome
            whatsapp
            cliente_id
            endereço
            valores
            diagnóstico
            observações
            */

            const { data, error } =
                await supabaseClient
                    .from("ordens_servico")
                    .select(
                        "codigo,aparelho,marca,modelo,tipo_servico,status"
                    )
                    .eq("codigo", codigo)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Erro ao consultar OS:",
                    error
                );

                mostrarMensagem(
                    "Não foi possível consultar a Ordem de Serviço.",
                    "error"
                );

                return;

            }


            if (!data) {

                mostrarMensagem(
                    "Ordem de Serviço não encontrada.",
                    "error"
                );

                return;

            }


            /*
            Preenche resultado
            */

            document.getElementById(
                "resultadoCodigo"
            ).textContent =
                escaparHTML(
                    data.codigo
                );


            document.getElementById(
                "resultadoAparelho"
            ).textContent =
                escaparHTML(
                    data.aparelho
                );


            document.getElementById(
                "resultadoMarca"
            ).textContent =
                escaparHTML(
                    data.marca
                );


            document.getElementById(
                "resultadoModelo"
            ).textContent =
                escaparHTML(
                    data.modelo
                );


            document.getElementById(
                "resultadoServico"
            ).textContent =
                escaparHTML(
                    data.tipo_servico
                );


            document.getElementById(
                "resultadoStatus"
            ).textContent =
                statusMap[data.status] ||
                data.status ||
                "-";
