<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Clientes — WS SOLUÇÕES</title>

    <!-- CSS EXCLUSIVO DA PÁGINA -->
    <link rel="stylesheet" href="css/clientes.css">

</head>


<body>


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                WS
            </div>

            <div class="brand-info">

                <strong>
                    WS SOLUÇÕES
                </strong>

                <span>
                    Clientes
                </span>

            </div>

        </div>


        <div class="topbar-actions">

            <!-- VOLTAR PARA A TELA INICIAL -->

            <button
                type="button"
                class="btn-back"
                id="btnVoltar"
                aria-label="Voltar para a tela inicial">

                ← Voltar

            </button>


            <!-- MODO NOTURNO -->

            <button
                id="themeToggle"
                class="theme-btn"
                type="button"
                aria-label="Ativar modo noturno">

                ☾

            </button>

        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="container">


        <!-- CABEÇALHO -->

        <section class="page-header">

            <div>

                <span class="section-label">
                    CADASTRO
                </span>

                <h1>
                    Clientes
                </h1>

                <p>
                    Gerencie os clientes da WS SOLUÇÕES.
                </p>

            </div>


            <button
                type="button"
                id="btnNovoCliente"
                class="btn-primary">

                + Novo cliente

            </button>

        </section>



        <!-- BUSCA -->

        <section class="card">

            <div class="search-box">

                <input
                    type="search"
                    id="buscaCliente"
                    placeholder="Buscar por nome, WhatsApp ou código..."
                    autocomplete="off">

            </div>

        </section>



        <!-- RESUMO -->

        <section class="stats-grid">

            <div class="stat-card">

                <span>
                    Total
                </span>

                <strong id="totalClientes">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Ativos
                </span>

                <strong id="clientesAtivos">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Inativos
                </span>

                <strong id="clientesInativos">
                    0
                </strong>

            </div>

        </section>



        <!-- LISTA DE CLIENTES -->

        <section class="card">

            <div class="section-title">

                <div>

                    <span class="section-label">
                        BASE DE DADOS
                    </span>

                    <h2>
                        Clientes cadastrados
                    </h2>

                </div>

            </div>


            <div
                id="listaClientes"
                class="clients-list">

                <div class="empty-state">

                    <div class="empty-icon">
                        👥
                    </div>

                    <h3>
                        Nenhum cliente cadastrado
                    </h3>

                    <p>
                        Clique em "Novo cliente" para começar.
                    </p>

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         MODAL CLIENTE
    ====================================================== -->

    <div
        id="modalCliente"
        class="modal"
        aria-hidden="true">


        <div class="modal-overlay"></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitulo">


            <!-- CABEÇALHO DO MODAL -->

            <div class="modal-header">

                <div>

                    <span class="section-label">
                        CADASTRO DE CLIENTE
                    </span>

                    <h2 id="modalTitulo">
                        Novo cliente
                    </h2>

                </div>


                <button
                    type="button"
                    id="btnFecharModal"
                    class="modal-close"
                    aria-label="Fechar">

                    ×

                </button>

            </div>



            <!-- FORMULÁRIO -->

            <form id="formCliente">


                <!-- ID INTERNO DO BANCO -->

                <input
                    type="hidden"
                    id="clienteId">



                <!-- =================================================
                     CÓDIGO DO CLIENTE
                ================================================== -->

                <div class="form-group client-code-field">

                    <label for="codigo">
                        Código do cliente
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Será gerado automaticamente"
                        readonly>

                    <small>
                        O código é gerado automaticamente pelo sistema.
                    </small>

                </div>



                <!-- =================================================
                     NOME
                ================================================== -->

                <div class="form-group">

                    <label for="nome">
                        Nome completo *
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome completo"
                        autocomplete="name"
                        required>

                </div>



                <!-- =================================================
                     WHATSAPP
                ================================================== -->

                <div class="form-group">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="(88) 99999-9999"
                        autocomplete="tel">

                </div>



                <!-- =================================================
                     ENDEREÇO
                ================================================== -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="cep">
                            CEP
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="63000-000"
                            autocomplete="postal-code">

                    </div>


                    <div class="form-group">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua / Avenida"
                            autocomplete="street-address">

                    </div>

                </div>



                <!-- =================================================
                     NÚMERO / COMPLEMENTO
                ================================================== -->

                <div class="form-row">

                    <div class="form-group form-small">

                        <label for="numero">
                            Número
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="123">

                    </div>


                    <div class="form-group">

                        <label for="complemento">
                            Complemento
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Casa, apartamento, etc.">

                    </div>

                </div>



                <!-- =================================================
                     BAIRRO
                ================================================== -->

                <div class="form-group">

                    <label for="bairro">
                        Bairro
                    </label>

                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Nome do bairro"
                        autocomplete="address-level3">

                </div>



                <!-- =================================================
                     OBSERVAÇÕES
                ================================================== -->

                <div class="form-group">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        placeholder="Informações adicionais sobre o cliente..."></textarea>

                </div>



                <!-- =================================================
                     AÇÕES
                ================================================== -->

                <div class="modal-actions">

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-secondary">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        id="btnSalvarCliente"
                        class="btn-primary">

                        Salvar cliente

                    </button>

                </div>


            </form>


        </div>

    </div>



    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast">

        <span id="toastMessage"></span>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão Supabase -->
    <script src="js/supabase.js"></script>

    <!-- Lógica da página Clientes -->
    <script src="js/clientes.js"></script>


    <!-- VOLTAR PARA A TELA INICIAL -->

    <script>

        document
            .getElementById("btnVoltar")
            .addEventListener("click", () => {

                window.location.href = "index.html";

            });

    </script>


</body>

</html>
