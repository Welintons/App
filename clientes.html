<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Clientes — WS SOLUÇÕES</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS ESPECÍFICO DA PÁGINA CLIENTES -->
    <link rel="stylesheet" href="css/clientes.css">

</head>


<body>


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                WS
            </div>

            <div class="brand-info">

                <strong>
                    WS SOLUÇÕES
                </strong>

                <span>
                    Clientes
                </span>

            </div>

        </div>


        <div class="topbar-actions">

            <button
                id="themeToggle"
                class="theme-btn"
                aria-label="Ativar modo noturno">

                ☾

            </button>

        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="container">


        <!-- =================================================
             CABEÇALHO
        ================================================== -->

        <section class="page-header">

            <div>

                <span class="section-label">
                    CADASTRO
                </span>

                <h1>
                    Clientes
                </h1>

                <p>
                    Gerencie os clientes da WS SOLUÇÕES.
                </p>

            </div>


            <button
                type="button"
                id="btnNovoCliente"
                class="btn-primary">

                + Novo cliente

            </button>

        </section>



        <!-- =================================================
             BUSCA
        ================================================== -->

        <section class="card">

            <div class="search-box">

                <input
                    type="search"
                    id="buscaCliente"
                    placeholder="Buscar por nome, WhatsApp ou código..."
                    autocomplete="off">

            </div>

        </section>



        <!-- =================================================
             RESUMO
        ================================================== -->

        <section class="stats-grid">


            <div class="stat-card">

                <span>
                    Total
                </span>

                <strong id="totalClientes">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Ativos
                </span>

                <strong id="clientesAtivos">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Inativos
                </span>

                <strong id="clientesInativos">
                    0
                </strong>

            </div>


        </section>



        <!-- =================================================
             LISTA DE CLIENTES
        ================================================== -->

        <section class="card">

            <div class="section-title">

                <div>

                    <span class="section-label">
                        BASE DE DADOS
                    </span>

                    <h2>
                        Clientes cadastrados
                    </h2>

                </div>

            </div>


            <div
                id="listaClientes"
                class="clients-list">


                <!-- ESTADO VAZIO -->

                <div class="empty-state">

                    <div class="empty-icon">
                        👥
                    </div>

                    <h3>
                        Nenhum cliente cadastrado
                    </h3>

                    <p>
                        Clique em "Novo cliente" para começar.
                    </p>

                </div>


            </div>

        </section>


    </main>



    <!-- =====================================================
         MODAL — CLIENTE
    ====================================================== -->

    <div
        id="modalCliente"
        class="modal"
        aria-hidden="true">


        <div class="modal-overlay"></div>


        <div class="modal-content">


            <!-- CABEÇALHO DO MODAL -->

            <div class="modal-header">

                <div>

                    <span class="section-label">
                        CLIENTE
                    </span>

                    <h2 id="modalTitulo">
                        Novo cliente
                    </h2>

                </div>


                <button
                    type="button"
                    id="btnFecharModal"
                    class="modal-close"
                    aria-label="Fechar">

                    ×

                </button>

            </div>



            <!-- =================================================
                 FORMULÁRIO
            ================================================== -->

            <form id="formCliente">


                <!-- ID -->

                <input
                    type="hidden"
                    id="clienteId">



                <!-- NOME -->

                <div class="form-group">

                    <label for="nome">
                        Nome *
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Nome completo"
                        required>

                </div>



                <!-- WHATSAPP -->

                <div class="form-group">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="(88) 99999-9999">

                </div>



                <!-- CPF -->

                <div class="form-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00">

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="cliente@email.com">

                </div>



                <!-- ENDEREÇO / NÚMERO -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua / Avenida">

                    </div>


                    <div class="form-group form-small">

                        <label for="numero">
                            Número
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="123">

                    </div>


                </div>



                <!-- COMPLEMENTO -->

                <div class="form-group">

                    <label for="complemento">
                        Complemento
                    </label>

                    <input
                        type="text"
                        id="complemento"
                        name="complemento"
                        placeholder="Casa, apartamento, etc.">

                </div>



                <!-- BAIRRO / CIDADE -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="bairro">
                            Bairro
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro">

                    </div>


                    <div class="form-group">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade">

                    </div>


                </div>



                <!-- ESTADO / CEP -->

                <div class="form-row">


                    <div class="form-group form-small">

                        <label for="estado">
                            Estado
                        </label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            maxlength="2"
                            placeholder="CE">

                    </div>


                    <div class="form-group">

                        <label for="cep">
                            CEP
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="63000-000">

                    </div>


                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status">

                        <option value="ativo">
                            Ativo
                        </option>

                        <option value="inativo">
                            Inativo
                        </option>

                    </select>

                </div>



                <!-- OBSERVAÇÕES -->

                <div class="form-group">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        placeholder="Informações adicionais..."></textarea>

                </div>



                <!-- =================================================
                     AÇÕES
                ================================================== -->

                <div class="modal-actions">


                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-secondary">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        id="btnSalvarCliente"
                        class="btn-primary">

                        Salvar cliente

                    </button>


                </div>


            </form>


        </div>

    </div>



    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast">

        <span id="toastMessage"></span>

    </div>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/clientes.js"></script>


</body>

</html>
